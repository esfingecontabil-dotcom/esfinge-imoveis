name: 🤖 Sincronização e Autodescoberta de Imóveis

on:
  schedule:
    - cron: "0 6 * * *" # Diariamente às 03:00 (Horário de Brasília)
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Instalar dependências
        run: npm install cheerio axios @supabase/supabase-js

      - name: 🚀 Executar Autodescoberta e Extração Massiva
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://oohtiefgaelsmvgvtezd.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_G91IjU8iNkKEUjs6o-FFIA_Z3gqUF8B"
        run: |
          node capturar_anuncios_exatos.mjs
          node autodescoberta_e_raspagem.mjs