name: 🤖 Sincronização Automática de Imóveis

on:
  schedule:
    - cron: "0 6 * * *" # Roda todo dia às 03:00 da manhã (Horário de Brasília)
  workflow_dispatch: # Permite rodar com 1 clique quando quiser

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm install cheerio axios @supabase/supabase-js

      - name: 🚀 Executar Mega-Varredura de Fotos e Imóveis Reais
        run: node crawler_universal_todas.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://oohtiefgaelsmvgvtezd.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_G91IjU8iNkKEUjs6o-FFIA_Z3gqUF8B' }}